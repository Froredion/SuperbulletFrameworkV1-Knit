name: Build and Release Framework Zip

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build InitializingProject.zip
        run: |
          cd framework
          zip -r ../InitializingProject.zip . -x "*.rbxl" "README.md"
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: InitializingProject.zip
          generate_release_notes: true
